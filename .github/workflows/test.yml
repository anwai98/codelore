name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hook-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: tests/test-hooks.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck hooks/*.sh tests/*.sh

  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          skills_ref_repo="git+https://github.com/agentskills/agentskills.git"
          python -m pip install "${skills_ref_repo}@38a2ff82958afee88dadf4831509e6f7e9d8ef4e#subdirectory=skills-ref"
      - name: Validate every skill against the Agent Skills spec
        run: |
          for skill in skills/*/; do
            echo "Validating ${skill}"
            skills-ref validate "${skill}"
          done

  validate-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate . --strict
      - run: claude plugin validate ./.claude-plugin/plugin.json
